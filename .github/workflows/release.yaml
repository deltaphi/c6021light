name: Release Workflow

on:
  release:
    types: [created, published, edited]

permissions:
  contents: write

jobs:
  generate:
    name: Create release-artifacts
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        cache: 'pip'
        python-version: '3.15'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run PlatformIO for Bluepill
      run: platformio run -d ${{ github.workspace }}/c6021light

    - name: Gather the Release artifacts
      shell: bash
      run: ${{ github.workspace }}/.github/copy-release-files.sh
      
    - name: Upload the artifacts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$RELEASE_TAG" .github/releasefiles/* --clobber
