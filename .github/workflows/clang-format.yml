name: Clang Format

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'

      - name: Install uv
        run: python -m pip install uv

      - name: Format project sources
        run: sh c6021light/apply-clang.sh

      - name: Check for formatting changes
        run: git diff --exit-code
