; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;default_envs = bluepill

[env]
lib_deps =
    https://github.com/deltaphi/RR32CanLibrary.git#cfdded54d3b305db831acabfc03799ff5c57db11
    https://github.com/deltaphi/LocoNet#c0fcf431981cb2bf5fdf443aa26b36a5241153cc
    https://github.com/deltaphi/AtomicRingBuffer#c0d0c528f987a834e2cb403d8c9d0525803b4310
    https://github.com/deltaphi/FlashFairyPP#1be69326cbe75c3327843d1fe7f2cf81e20a545f

build_flags = -I include -D LN_TX_ECHO=0 -Wl,-Map,\"${BUILD_DIR}/firmware.map\" -Wall -Wextra -pedantic

[env:bluepill]
platform = ststm32@20.0.0
board = bluepill_f103c8
framework = libopencm3

board_build.ldscript = stm32f103c8.ld

monitor_speed = 115200
#monitor_port = COM4
monitor_raw = yes
;upload_protocol = serial

lib_archive = no
build_flags = ${env.build_flags} -lc
lib_deps =
        ${env.lib_deps}

; Section: Remote Debugging
;build_type = debug
;debug_tool = custom
;debug_port = modellbahn-bpi.fritz.box:3333
;debug_server =
; End: Remote Debugging

; Secion: Attach a debugger to a running target without reset
#debug_load_mode = manual

; attach debugger without reset
#debug_init_cmds =
#  target extended-remote $DEBUG_PORT
#  $INIT_BREAK
#  monitor halt
#  monitor init
#  monitor resume
; End: Attach a debugger to a running target without reset
